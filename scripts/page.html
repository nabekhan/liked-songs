<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Liked Songs · Nabeel</title>
<style>
:root{font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203a38;background:#f5f5ef;--line:#d9e1db;--muted:#5c716b;--accent:#176f59;--surface:#fffef9}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:56px 24px}a{color:var(--accent);text-underline-offset:3px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:32px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:12px;color:var(--muted)}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.05em;line-height:1.1;margin:10px 0 16px}p{margin:8px 0;color:var(--muted)}.nav{display:flex;gap:18px;flex-wrap:wrap;padding-top:10px;font-size:14px}.search-wrap{background:var(--surface);border:1px solid var(--line);padding:22px;border-radius:18px;margin-bottom:24px}label{display:block;font-weight:600;margin-bottom:9px}input[type=search]{width:100%;font:inherit;font-size:20px;color:inherit;background:transparent;border:1px solid var(--line);padding:14px 16px;border-radius:10px}input:focus,button:focus-visible,select:focus-visible{outline:3px solid #73c8a4;outline-offset:3px}.help{font-size:13px;margin:10px 0 0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}.controls{display:flex;gap:12px;align-items:center}button,select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:16px 18px;border-bottom:1px solid var(--line)}td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}.song{font-weight:600}.detail{font-size:12px;color:var(--muted);margin-top:3px}.id{font:11px ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.time{white-space:nowrap;color:var(--muted)}.pager{display:flex;gap:16px;align-items:center;justify-content:center;margin:24px 0}footer{font-size:13px;color:var(--muted);margin-top:32px}.empty{padding:36px;text-align:center}#status{font-size:14px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-width:640px){main{padding:30px 14px}header{display:block}.nav{margin-top:20px}td,th{padding:12px}.identifiers{display:none}.search-wrap{padding:16px}.controls{flex-wrap:wrap}}@media(prefers-color-scheme:dark){:root{color:#e0eae2;background:#142320;--line:#344a40;--muted:#9bb5a6;--accent:#83d9b2;--surface:#1b2d27}}
</style>
</head>
<body><main>
<header><div><h1>Liked Songs</h1><p id="synced"></p></div><nav class="nav" aria-label="Links"><a id="collection" href="https://musicbrainz.org/collection/4cad0217-1cbe-43ae-b148-afa5afad7625" target="_blank" rel="noopener">MusicBrainz collection ↗</a><a href="https://github.com/nabekhan/musicbrainz-liked-songs" target="_blank" rel="noopener">Repository ↗</a></nav></header>
<section class="search-wrap" aria-label="Search collection"><input id="query" type="search" aria-label="Search songs" placeholder="Song, artist, ISRC, or MusicBrainz ID…" autocomplete="off" spellcheck="false"></section>
<div class="toolbar"><div id="status" role="status" aria-live="polite"></div><div class="controls"><label class="visually-hidden" for="sort">Sort results</label><select id="sort"><option value="title">Song A–Z</option><option value="artist">Artist A–Z</option></select><button id="download" type="button">Download results CSV</button></div></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Song</th><th scope="col">Artist</th><th scope="col">Length</th><th scope="col" class="identifiers">Identifiers</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="scroll-sentinel" aria-hidden="true" style="height:1px"></div>
<footer>Mirrors the recordings in the MusicBrainz collection. Updates daily. <a href="https://github.com/nabekhan/musicbrainz-liked-songs/actions/workflows/sync.yml" target="_blank" rel="noopener">Sync now / check updates ↗</a></footer>
</main><script id="collection-data" type="application/json"><!-- COLLECTION_DATA --></script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('collection-data').textContent);
const normalize=s=>String(s??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
const songs=data.songs.map(song=>({...song,search:normalize([song.title,song.artist,song.isrcs,song.recording_mbid,song.artist_mbids,song.work_mbids,song.works,song.disambiguation].join(' '))}));
const byId=id=>document.getElementById(id);let filtered=songs,rendered=0;const batchSize=100;let timer;
byId('synced').textContent=`${data.count.toLocaleString()} recordings · Updated ${new Date(data.synced_at).toLocaleString()}`;
if(location.protocol==='https:'||location.protocol==='http:')fetch('sync-status.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(s=>{if(s)byId('synced').textContent=`${data.count.toLocaleString()} recordings · Checked ${new Date(s.checked_at).toLocaleString()}`;}).catch(()=>{});
function tokens(query){return [...normalize(query).matchAll(/"([^"]+)"|(\S+)/g)].map(m=>m[1]||m[2]);}
function cell(text,cls){const td=document.createElement('td');td.textContent=text;if(cls)td.className=cls;return td;}
function length(ms){if(ms==null)return '—';const secs=Math.round(ms/1000);return `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;}
function apply(){const terms=tokens(byId('query').value);filtered=songs.filter(s=>terms.every(t=>s.search.includes(t)));const sort=byId('sort').value;filtered.sort((a,b)=>a[sort].localeCompare(b[sort],undefined,{sensitivity:'base'})||a.title.localeCompare(b.title)||a.recording_mbid.localeCompare(b.recording_mbid));rendered=0;byId('rows').replaceChildren();byId('scroll-sentinel').hidden=false;render();}
function render(){const rows=byId('rows');const end=Math.min(rendered+batchSize,filtered.length);const fragment=document.createDocumentFragment();for(const s of filtered.slice(rendered,end)){const tr=document.createElement('tr'),title=cell('');const a=document.createElement('a');a.href=`https://musicbrainz.org/recording/${s.recording_mbid}`;a.textContent=s.title;a.className='song';a.target='_blank';a.rel='noopener';title.append(a);if(s.disambiguation||s.video){const note=document.createElement('div');note.className='detail';note.textContent=[s.disambiguation,s.video?'Video':''].filter(Boolean).join(' · ');title.append(note);}tr.append(title,cell(s.artist),cell(length(s.length_ms),'time'));const ids=cell('','identifiers');const mb=document.createElement('div');mb.className='id';mb.textContent=s.recording_mbid;ids.append(mb);if(s.isrcs){const isrc=document.createElement('div');isrc.className='detail';isrc.textContent=`ISRC: ${s.isrcs}`;ids.append(isrc);}tr.append(ids);fragment.append(tr);}rows.append(fragment);rendered=end;if(!filtered.length&&!rows.children.length){const tr=document.createElement('tr'),td=cell('No songs match. Try fewer words or another spelling.','empty');td.colSpan=4;tr.append(td);rows.append(tr);}byId('status').textContent=byId('query').value.trim()?`${filtered.length.toLocaleString()} matching recordings of ${songs.length.toLocaleString()}`:`${songs.length.toLocaleString()} recordings`;byId('scroll-sentinel').hidden=rendered>=filtered.length;byId('download').disabled=!filtered.length;}
byId('query').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(apply,120);});byId('sort').addEventListener('change',apply);
byId('download').addEventListener('click',()=>{const keys=['title','artist','recording_mbid','artist_mbids','length_ms','isrcs','work_mbids','works','disambiguation','video','musicbrainz_url'];const quote=v=>{let text=String(v??'');if(/^[=+@\-\t\r\n]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const csv='\ufeff'+[keys.map(quote).join(','),...filtered.map(s=>keys.map(k=>quote(s[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='liked-songs-search.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
apply();
const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&rendered<filtered.length)render();},{rootMargin:'600px'});observer.observe(byId('scroll-sentinel'));
</script></body></html>
