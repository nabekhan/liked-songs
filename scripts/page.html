<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Liked Songs · Nabeel</title>
<style>
body{max-width:1000px;margin:40px auto;padding:0 10px;font-size:18px;line-height:1.6;color:#222;background:#fff}
p{margin:0.5em 0}
#synced{font-weight:bold}
.nav{display:flex;flex-wrap:wrap;gap:16px;margin:1em 0}
input[type=search]{box-sizing:border-box;flex:1;min-width:0;font:inherit;padding:6px}
.toolbar{display:flex;align-items:center;gap:8px;margin:1em 0}
button{font:inherit;flex-shrink:0}
th button{border:0;background:none;padding:0;color:inherit;cursor:pointer;white-space:nowrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
th:nth-child(1){width:29%}th:nth-child(2){width:22%}th:nth-child(3){width:9%}th:nth-child(4){width:28%}th:nth-child(5){width:12%}
.youtube a{white-space:nowrap}
.detail{font-size:0.8em}
.id{font:12px/1.6 monospace;overflow-wrap:anywhere}
.time{white-space:nowrap}
.empty{text-align:center;padding:24px}
#scroll-sentinel{overflow-anchor:none}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:640px){body{margin:20px auto;font-size:16px}.identifiers{display:none}th:nth-child(1){width:34%}th:nth-child(2){width:26%}th:nth-child(3){width:16%}th:nth-child(5){width:24%}}
</style>
</head>
<body><main>
<header><div><p id="synced"></p></div><nav class="nav" aria-label="Links"><a id="collection" href="https://musicbrainz.org/collection/4cad0217-1cbe-43ae-b148-afa5afad7625" target="_blank" rel="noopener">MusicBrainz collection ↗</a><a href="https://github.com/nabekhan/musicbrainz-liked-songs" target="_blank" rel="noopener">Repository ↗</a><a href="https://github.com/nabekhan/musicbrainz-liked-songs/actions/workflows/sync.yml" target="_blank" rel="noopener">Refresh ↗</a></nav></header>
<div class="toolbar"><input id="query" type="search" aria-label="Search songs" placeholder="Song, artist, ISRC, or MusicBrainz ID…" autocomplete="off" spellcheck="false"><button id="download" type="button">Download CSV</button></div>
<div class="table-wrap"><table><thead><tr><th scope="col" aria-sort="ascending"><button type="button" data-sort="title">Song<span aria-hidden="true"> ↑</span></button></th><th scope="col" aria-sort="none"><button type="button" data-sort="artist">Artist<span aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button type="button" data-sort="length_ms">Length<span aria-hidden="true"></span></button></th><th scope="col" class="identifiers" aria-sort="none"><button type="button" data-sort="recording_mbid" title="Sort by recording MBID">Identifiers<span aria-hidden="true"></span></button></th><th scope="col" class="youtube">YouTube</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="scroll-sentinel" aria-hidden="true" style="height:1px"></div>
</main><script id="collection-data" type="application/json"><!-- COLLECTION_DATA --></script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('collection-data').textContent);
const normalize=s=>String(s??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
function nameWords(song){const words=new Set();for(const text of [song.title,song.artist]){const parts=normalize(text).match(/[\p{L}\p{N}]+/gu)||[];for(let i=0;i<parts.length;i++){words.add(parts[i]);if(i+1<parts.length)words.add(parts[i]+parts[i+1]);}words.add(parts.join(''));}return [...words].filter(w=>w.length>=3&&w.length<=50);}
const songs=data.songs.map(song=>({...song,search:normalize([song.title,song.artist,song.isrcs,song.recording_mbid,song.artist_mbids,song.work_mbids,song.works,song.disambiguation].join(' ')),nameWords:nameWords(song)}));
const byId=id=>document.getElementById(id);let filtered=songs,rendered=0;const initialRows=40;let timer;const sortState={key:'title',ascending:true};
byId('synced').textContent=`${data.count.toLocaleString()} recordings · Updated ${new Date(data.synced_at).toLocaleString()}`;
if(location.protocol==='https:'||location.protocol==='http:')fetch('sync-status.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(s=>{if(s)byId('synced').textContent=`${data.count.toLocaleString()} recordings · Checked ${new Date(s.checked_at).toLocaleString()}`;}).catch(()=>{});
function tokens(query){return [...normalize(query).matchAll(/"([^"]+)"|(\S+)/g)].map(m=>m[1]||m[2]);}
function cell(text,cls){const td=document.createElement('td');td.textContent=text;if(cls)td.className=cls;return td;}
function length(ms){if(ms==null)return '—';const secs=Math.round(ms/1000);return `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;}
function wordDistance(a,b,limit){if(Math.abs(a.length-b.length)>limit)return Infinity;let beforePrevious=null,previous=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const current=[i];let minimum=i;for(let j=1;j<=b.length;j++){current[j]=Math.min(previous[j]+1,current[j-1]+1,previous[j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])current[j]=Math.min(current[j],beforePrevious[j-2]+1);minimum=Math.min(minimum,current[j]);}if(minimum>limit)return Infinity;beforePrevious=previous;previous=current;}return previous[b.length]<=limit?previous[b.length]:Infinity;}
function fuzzyTerm(term){const compact=term.replace(/[^\p{L}\p{N}]/gu,'');const precise=/\d/.test(term)||/^[a-f0-9-]{8,}$/.test(term);return {term,compact,limit:!precise&&compact.length>=4&&compact.length<=48?(compact.length>=6?2:1):0};}
function fuzzyScore(song,terms){let score=0;for(const t of terms){if(song.search.includes(t.term))continue;if(!t.limit)return Infinity;let best=Infinity;for(const word of song.nameWords){best=Math.min(best,wordDistance(t.compact,word,t.limit));if(best===0)break;}if(!Number.isFinite(best))return Infinity;score+=best;}return score;}
function compareSongs(a,b){const key=sortState.key,direction=sortState.ascending?1:-1;let primary;if(key==='length_ms'){if(a[key]==null&&b[key]!=null)return 1;if(a[key]!=null&&b[key]==null)return -1;primary=(a[key]??0)-(b[key]??0);}else primary=a[key].localeCompare(b[key],undefined,{sensitivity:'base'});return direction*(primary||a.title.localeCompare(b.title)||a.recording_mbid.localeCompare(b.recording_mbid));}
function updateSortHeaders(){document.querySelectorAll('th button[data-sort]').forEach(button=>{const active=button.dataset.sort===sortState.key;button.closest('th').setAttribute('aria-sort',active?(sortState.ascending?'ascending':'descending'):'none');button.querySelector('span').textContent=active?(sortState.ascending?' ↑':' ↓'):'';});}
function apply(){const terms=tokens(byId('query').value);filtered=songs.filter(s=>terms.every(t=>s.search.includes(t)));if(terms.length&&!filtered.length){const fuzzy=terms.map(fuzzyTerm);if(fuzzy.some(t=>t.limit)){let best=Infinity;for(const song of songs){const score=fuzzyScore(song,fuzzy);if(score<best){best=score;filtered=[];}if(Number.isFinite(score)&&score===best)filtered.push(song);}}}filtered.sort(compareSongs);updateSortHeaders();rendered=0;byId('rows').replaceChildren();byId('scroll-sentinel').hidden=false;render(initialRows);fillViewport();}
function render(count=1){const rows=byId('rows');const end=Math.min(rendered+count,filtered.length);const fragment=document.createDocumentFragment();for(const s of filtered.slice(rendered,end)){const tr=document.createElement('tr'),title=cell('');const a=document.createElement('a');a.href=`https://musicbrainz.org/recording/${s.recording_mbid}`;a.textContent=s.title;a.className='song';a.target='_blank';a.rel='noopener';title.append(a);if(s.disambiguation||s.video){const note=document.createElement('div');note.className='detail';note.textContent=[s.disambiguation,s.video?'Video':''].filter(Boolean).join(' · ');title.append(note);}tr.append(title,cell(s.artist),cell(length(s.length_ms),'time'));const ids=cell('','identifiers');const mb=document.createElement('div');mb.className='id';mb.textContent='MBID: '+s.recording_mbid;ids.append(mb);if(s.isrcs){const isrc=document.createElement('div');isrc.className='detail';isrc.textContent=`ISRC: ${s.isrcs}`;ids.append(isrc);}tr.append(ids);const youtube=cell('','youtube'),search=document.createElement('a');search.href=`https://www.youtube.com/results?search_query=${encodeURIComponent([s.artist,s.title].filter(Boolean).join(' '))}`;search.textContent='Search ↗';search.setAttribute('aria-label',`Search YouTube for ${s.title} by ${s.artist} (opens in a new tab)`);search.target='_blank';search.rel='noopener noreferrer';youtube.append(search);tr.append(youtube);fragment.append(tr);}rows.append(fragment);rendered=end;if(!filtered.length&&!rows.children.length){const tr=document.createElement('tr'),td=cell('No songs match. Try fewer words or another spelling.','empty');td.colSpan=5;tr.append(td);rows.append(tr);}byId('scroll-sentinel').hidden=rendered>=filtered.length;byId('download').disabled=!filtered.length;}
byId('query').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(apply,120);});document.querySelectorAll('th button[data-sort]').forEach(button=>button.addEventListener('click',()=>{if(sortState.key===button.dataset.sort)sortState.ascending=!sortState.ascending;else{sortState.key=button.dataset.sort;sortState.ascending=true;}apply();}));
byId('download').addEventListener('click',()=>{const keys=['title','artist','recording_mbid','artist_mbids','length_ms','isrcs','work_mbids','works','disambiguation','video','musicbrainz_url'];const quote=v=>{let text=String(v??'');if(/^[=+@\-\t\r\n]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const csv='\ufeff'+[keys.map(quote).join(','),...filtered.map(s=>keys.map(k=>quote(s[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='liked-songs-search.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
function fillViewport(){while(rendered<filtered.length&&document.documentElement.getBoundingClientRect().bottom<=document.documentElement.clientHeight+100)render();}
window.addEventListener('scroll',fillViewport,{passive:true});
window.addEventListener('resize',fillViewport);
apply();
</script></body></html>
