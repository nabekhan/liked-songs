name: Sync ListenBrainz Loves
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes (requires LISTENBRAINZ_SYNC_ENABLED=true)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: listenbrainz-collection-sync
  cancel-in-progress: false
jobs:
  sync:
    # No writes can run until deliberately enabled after cleanup and review.
    # A manual preview remains available without enabling writes.
    if: >-
      vars.LISTENBRAINZ_SYNC_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.apply == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test ListenBrainz sync without network writes
        run: python -m unittest discover -s scripts -p 'test_listenbrainz.py'
      - name: Load durable ownership checkpoint
        shell: bash
        run: |
          mkdir -p .cache
          # Network errors must fail here, never masquerade as a first run.
          git ls-remote origin refs/heads/listenbrainz-sync-state > .cache/listenbrainz-remote-state
          if [ -s .cache/listenbrainz-remote-state ]; then
            git fetch --no-tags origin refs/heads/listenbrainz-sync-state
            git rev-parse FETCH_HEAD > .cache/listenbrainz-state-parent
            git show FETCH_HEAD:state.json > .cache/listenbrainz-state.json
          fi
      - name: Reconcile collection and ListenBrainz
        env:
          MUSICBRAINZ_CLIENT_ID: ${{ secrets.MUSICBRAINZ_CLIENT_ID }}
          MUSICBRAINZ_CLIENT_SECRET: ${{ secrets.MUSICBRAINZ_CLIENT_SECRET }}
          MUSICBRAINZ_REFRESH_TOKEN: ${{ secrets.MUSICBRAINZ_REFRESH_TOKEN }}
          LISTENBRAINZ_TOKEN: ${{ secrets.LISTENBRAINZ_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        shell: bash
        run: |
          args=()
          if [ "$APPLY" = 'true' ]; then
            args+=(--apply --publish-state)
          fi
          python scripts/sync_listenbrainz.py "${args[@]}"
